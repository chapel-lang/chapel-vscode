name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26, lts/*, latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
    - name: NPM install
      run: |
        npm ci
        npm list -a
    - name: Test
      run: |
        npm run pretest
        npm run test:node
        npm run test:grammar
    - name: Test packaging
      run: |
        mkdir -p bin
        npx vsce package -o bin/chapel.vsix
    - name: Check wrappers are executable in the package
      run: |
        zipinfo bin/chapel.vsix 'extension/wrappers/*'
        for f in chpl mason conditional-build-run; do
          zipinfo bin/chapel.vsix "extension/wrappers/$f" | grep -q '^-rwx' || {
            echo "extension/wrappers/$f is missing or not executable in the VSIX"
            exit 1
          }
        done
    - name: set artifact name
      run: |
        ARTIFACT_VER=$(sed "s/lts\/\*/lts-latest/g" <<< "${{ matrix.node-version }}")
        echo "PACKAGE_ARTIFACT_NAME=chapel-package-node${ARTIFACT_VER}.vsix" >> "$GITHUB_ENV"
    - name: upload package
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ env.PACKAGE_ARTIFACT_NAME }}
        path: bin/chapel.vsix

  wrappers:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest covers the system bash 3.2
        os: [ubuntu-latest, macos-latest]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
    - name: NPM install
      run: npm ci
    - name: Test wrappers
      run: npm run test:wrappers

  vscode-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # unit-min-engine runs against the minimum VS Code version in package.json
        label: [unit, unit-min-engine, unit-startup, unit-no-folder, unit-mason, unit-tasks]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
    - name: NPM install
      run: npm ci
    - name: Cache VS Code downloads
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .vscode-test
        key: vscode-test-${{ matrix.label }}-${{ hashFiles('package.json') }}
    - name: Test
      run: |
        npm run pretest:vscode
        xvfb-run -a npx vscode-test --label ${{ matrix.label }}

  integration:
    runs-on: ubuntu-latest
    container: chapel/chapel:${{ matrix.chapel }}
    continue-on-error: ${{ matrix.chapel == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        chapel: [latest, "2.8.0", nightly]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
    - name: Install Electron dependencies
      run: test/scripts/install-electron-deps.sh
    - name: NPM install
      run: npm ci
    - name: Show Chapel tools
      run: |
        command -v chpl chplcheck chpl-language-server mason
        chpl-language-server --version
    - name: Test
      run: xvfb-run -a npm run test:integration

  # Homebrew installs chpl and the tools as symlinks into /opt/homebrew/bin with no CHPL_HOME set
  integration-homebrew:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: lts/*
    - name: Install Chapel
      run: brew install chapel
    - name: NPM install
      run: npm ci
    - name: Show Chapel tools
      run: |
        command -v chpl chplcheck chpl-language-server mason
        chpl --print-chpl-home
        chpl-language-server --version
    - name: Test
      run: npm run test:integration
